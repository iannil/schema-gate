name: SchemaGate Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema-gate
        run: pip install schema-gate
      - name: Run SchemaGate (G1-G5) with SARIF output
        run: |
          schema-gate check --contract schema-contract.json --format sarif src/ > schema-gate.sarif || {
            schema-gate check --contract schema-contract.json src/
            exit 2
          }
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: schema-gate.sarif
